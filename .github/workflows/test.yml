name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - run: chmod +x gradlew
      - name: Clone KarenBot-Resources
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/xszqxszq/KarenBot-Resources.git ../KarenBot-Resources
          cd ../KarenBot-Resources
          git sparse-checkout set data/maimai data/chunithm
          git checkout
          cd -
          ln -s ../KarenBot-Resources/data data
      - name: Generate config files
        run: |
          mkdir -p config
          cat > config/maimai.yml << 'YAML'
          tokens:
            diving-fish: "${{ secrets.DIVING_FISH_TOKEN }}"
            lxns: "${{ secrets.LXNS_TOKEN }}"
            lxns-oa-id: "${{ secrets.LXNS_OA_ID }}"
            lxns-oa-secret: "${{ secrets.LXNS_OA_SECRET }}"
            lxns-oa-callback: "http://localhost:18100/lxns/callback"
            assets-jacket: "https://example.com/maimai/jacket"
            proxy-ip: "127.0.0.1"
            proxy-server: "127.0.0.1"
            proxy-port: "18100"
          tips: []
          YAML
          cat > config/chunithm.yml << 'YAML'
          tokens:
            diving-fish: "${{ secrets.DIVING_FISH_TOKEN }}"
            lxns: "${{ secrets.LXNS_TOKEN }}"
            lxns-oa-id: "${{ secrets.LXNS_OA_ID }}"
            lxns-oa-secret: "${{ secrets.LXNS_OA_SECRET }}"
            lxns-oa-callback: "http://localhost:18100/lxns/callback"
            assets-jacket: "https://example.com/chunithm/jacket"
          YAML
      - run: ./gradlew test
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 1
