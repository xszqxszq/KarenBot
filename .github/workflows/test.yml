name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - run: chmod +x gradlew
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Clone KarenBot-Resources
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/xszqxszq/KarenBot-Resources.git ../KarenBot-Resources
          cd ../KarenBot-Resources
          git sparse-checkout set --no-cone data/maimai/ data/chunithm/ data/audio/otto/ test/data/ test/config/
          git checkout
          cd -
          ln -s ../KarenBot-Resources/data data
          mkdir -p data/maimai/covers data/maimai/plates data/maimai/avatars data/chunithm/covers
      - name: Set up test config and data
        run: |
          mkdir -p config
          cp -r ../KarenBot-Resources/test/data/. data/
          cp -r ../KarenBot-Resources/test/config/. config/
          sed -i \
            -e "s|__DIVING_FISH_TOKEN__|${{ secrets.DIVING_FISH_TOKEN }}|g" \
            -e "s|__LXNS_TOKEN__|${{ secrets.LXNS_TOKEN }}|g" \
            -e "s|__LXNS_OA_ID__|${{ secrets.LXNS_OA_ID }}|g" \
            -e "s|__LXNS_OA_SECRET__|${{ secrets.LXNS_OA_SECRET }}|g" \
            -e "s|__DIVING_FISH_OA_ID__|${{ secrets.DIVING_FISH_OA_ID }}|g" \
            -e "s|__DIVING_FISH_OA_SECRET__|${{ secrets.DIVING_FISH_OA_SECRET }}|g" \
            config/maimai.yml config/chunithm.yml
      - name: Run tests
        id: run-tests
        run: ./gradlew test
        continue-on-error: true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 1
      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
